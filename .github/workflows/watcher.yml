name: Watcher

# The Cascadia Offshore Sensor Atlas's stream check, every hour: how every watched sensor recorded over the 24 hours
# before (red: no sample in them; yellow: samples, but a gap longer than normal; blue: the Navy's diversion), from
# Nereus's hourly checks, OOI ERDDAP, EarthScope's 8 Hz and 200 Hz seismic data, OOI's raw data server and the PI data
# portal, with each instrument's open operator note in Nereus. The result goes to the watch-data branch (latest.json,
# and days/YYYY-MM-DD.json, the last of each UTC day), force-pushed as one commit so the branch keeps no history and the
# site is not rebuilt. The Atlas Worker's /v1/status reads it, lays Nereus's live status over it, and serves the map and
# Ask Atlas. bin/watcher/ is copied from RCA-Atlas src/atlas_watch/; edit it there.

on:
  workflow_dispatch:
    inputs:
      day:
        description: "a past UTC day to grade (YYYY-MM-DD) into days/ only; empty for the 24 hours to now"
        required: false
  schedule:
    - cron: "20 * * * *"   # every hour, 20 minutes past, once Nereus's hour is in

permissions:
  contents: write

concurrency:
  group: watcher
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch the last results
        run: |
          mkdir -p store
          if git fetch -q --depth 1 origin watch-data; then git archive FETCH_HEAD | tar -x -C store; fi
          ls store

      - name: Check the 24 hours
        env:
          DAY: ${{ github.event.inputs.day }}
        run: |
          python3 bin/watcher/check.py --watchlist bin/watcher/watchlist.json \
            --previous store/latest.json --out /tmp/report.json ${DAY:+--day "$DAY"}
          python3 - <<'PY'
          import json, shutil
          from pathlib import Path
          new = json.loads(Path("/tmp/report.json").read_text())
          Path("store/days").mkdir(parents=True, exist_ok=True)
          shutil.copy("/tmp/report.json", f"store/days/{new['day']}.json")
          latest = Path("store/latest.json")
          old = json.loads(latest.read_text()) if latest.exists() else {}
          reach = lambda r: r.get("to") or (r.get("day", "") + "T23:59:59Z")
          if reach(new) >= reach(old):
              shutil.copy("/tmp/report.json", latest)
          PY

      - name: Publish to watch-data
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd store
          git init -q -b watch-data
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Watcher: $(python3 -c "import json; print(json.load(open('latest.json'))['to'])")"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" watch-data
